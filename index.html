<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="はい・いいえで答えるだけで、今の自分に合う小さな行動と、物事を分けて考える練習ミッションが見つかるサイト。">
<title>しくみ分解ラボ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+1+Code:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: 方眼紙の作業台。ミッションは「部品トレイ → 仕分け箱」に分けて置く、分解図の世界観 */
:root{
  --paper:#EEF2F4; --sheet:#FFFFFF; --ink:#16212C; --muted:#56636F; --line:#CDD6DD; --grid:rgba(22,33,44,.07);
  --accent:#FFC21A; --accent-ink:#16212C;
  --c1:#13806F; --c2:#C94F3B; --c3:#5B4FC4; --c4:#9A6A00;
  --c1-bg:#E1F2EE; --c2-bg:#F8E6E2; --c3-bg:#E9E7FA; --c4-bg:#F6EED9;
  --ok:#1D7F46; --ng:#C23B26; --ok-bg:#E2F3E8; --ng-bg:#FBE5E1;
  --f-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --f-mono:"M PLUS 1 Code",ui-monospace,"Menlo",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F161D; --sheet:#17212B; --ink:#E6EDF2; --muted:#9AA8B4; --line:#2B3946; --grid:rgba(230,237,242,.05);
  --accent:#FFC21A; --accent-ink:#16212C;
  --c1:#4CC3AE; --c2:#F08A74; --c3:#A79CFF; --c4:#E2B44A;
  --c1-bg:#15302C; --c2-bg:#3A221D; --c3-bg:#25223F; --c4-bg:#33291A;
  --ok:#5BD08A; --ng:#FF8A73; --ok-bg:#163223; --ng-bg:#3A1F1A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F161D; --sheet:#17212B; --ink:#E6EDF2; --muted:#9AA8B4; --line:#2B3946; --grid:rgba(230,237,242,.05);
  --accent:#FFC21A; --accent-ink:#16212C;
  --c1:#4CC3AE; --c2:#F08A74; --c3:#A79CFF; --c4:#E2B44A;
  --c1-bg:#15302C; --c2-bg:#3A221D; --c3-bg:#25223F; --c4-bg:#33291A;
  --ok:#5BD08A; --ng:#FF8A73; --ok-bg:#163223; --ng-bg:#3A1F1A; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.chip:focus-visible,.bin:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.label{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:700}

/* top bar */
.top{padding-block:14px}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--f-display);font-size:20px;letter-spacing:.02em;background:none;border:0;padding:0;display:flex;align-items:center;gap:8px}
.logo i{display:inline-grid;place-items:center;width:28px;height:28px;background:var(--accent);color:var(--accent-ink);border-radius:6px;font-style:normal;font-size:15px}
.rank{display:flex;align-items:center;gap:8px;background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 6px;font-size:13px}
.rank b{font-family:var(--f-mono);background:var(--ink);color:var(--paper);border-radius:999px;padding:1px 8px;font-size:12px}

/* hero */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:center;padding-block:28px 36px}
.hero > div{min-width:0}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,6.4vw,46px);line-height:1.3;margin-top:8px}
.hero h1 mark{background:linear-gradient(transparent 58%,var(--accent) 58%);color:inherit;padding:0 2px}
.hero p.lead{margin-top:14px;color:var(--muted);max-width:30em}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.btn{border:2px solid var(--ink);background:var(--sheet);border-radius:10px;padding:10px 18px;font-weight:700;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent-ink);box-shadow:3px 3px 0 var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:3px 3px 0 var(--ink)}
.diagram{width:100%;max-width:320px;justify-self:center}
.diagram .t{font-family:var(--f-body);font-weight:700;font-size:13px;fill:var(--ink)}
.diagram .s{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
.diagram .core{fill:var(--sheet);stroke:var(--ink);stroke-width:2}
.diagram .lead-line{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 4;fill:none}
.diagram .p1{fill:var(--c1-bg);stroke:var(--c1);stroke-width:2}
.diagram .p2{fill:var(--c2-bg);stroke:var(--c2);stroke-width:2}
.diagram .p3{fill:var(--c3-bg);stroke:var(--c3);stroke-width:2}

/* sections */
section.block{padding-block:28px;border-top:2px solid var(--ink)}
section.block h2{font-family:var(--f-display);font-weight:400;font-size:24px;margin-top:4px}
section.block .sub{color:var(--muted);margin-top:6px}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.tool{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tool h3{font-size:18px;display:flex;align-items:baseline;gap:8px}
.tool h3 span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.tool p{font-size:14px}
.tool .use{font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;margin-top:auto}
.tool .use b{color:var(--ink)}

/* map */
.level{margin-top:22px}
.level-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.level-head .lv{font-family:var(--f-mono);font-weight:700;background:var(--ink);color:var(--paper);border-radius:6px;padding:1px 8px;font-size:13px}
.level-head h3{font-size:19px}
.level-head p{color:var(--muted);font-size:14px;width:100%}
.missions{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:10px}
.mcard{text-align:left;background:var(--sheet);border:2px solid var(--ink);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s;min-width:0}
.mcard:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.mcard .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mcard strong{font-size:17px}
.mcard .desc{font-size:14px;color:var(--muted)}
.stars{font-family:var(--f-mono);letter-spacing:2px;color:var(--line);font-size:15px;white-space:nowrap}
.stars .on{color:var(--accent)}
.tag{font-family:var(--f-mono);font-size:11px;font-weight:700;border:1px solid var(--line);border-radius:4px;padding:0 6px;color:var(--muted)}

.note{font-size:13px;color:var(--muted);padding-block:24px 40px;border-top:1px solid var(--line);margin-top:12px;display:flex;flex-direction:column;gap:6px}
.note a{color:inherit}

/* play */
.play{padding-block:8px 48px}
.back{background:none;border:0;padding:4px 0;color:var(--muted);font-size:14px}
.play-head{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.play-head h2{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.35}
.scene{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:14px;font-size:15px}
.scene b{background:linear-gradient(transparent 60%,var(--accent) 60%)}
.howto{font-size:13px;color:var(--muted);margin-top:12px}
.tray{margin-top:10px;background:var(--sheet);border:2px dashed var(--line);border-radius:12px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;min-height:64px}
.tray:empty::before{content:"部品はすべて箱に入りました";color:var(--muted);font-size:14px;align-self:center}
.chip{background:var(--paper);border:1.5px solid var(--ink);border-radius:8px;padding:6px 10px;font-size:14px;line-height:1.5;text-align:left;max-width:100%}
.chip.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent-ink);box-shadow:2px 2px 0 var(--ink)}
.chip.ok{border-color:var(--ok);background:var(--ok-bg)}
.chip.ng{border-color:var(--ng);background:var(--ng-bg)}
.chip .mk{font-family:var(--f-mono);font-weight:700;margin-right:4px}
.chip.ok .mk{color:var(--ok)} .chip.ng .mk{color:var(--ng)}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:14px}
.bin{background:var(--sheet);border:2px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:120px;text-align:left;min-width:0}
.bin.ready{border-color:var(--ink);border-style:dashed}
.bin .bl{display:inline-flex;align-self:flex-start;font-weight:700;font-size:14px;border-radius:6px;padding:2px 10px}
.bin .bh{font-size:12px;color:var(--muted);line-height:1.5}
.bin .in{display:flex;flex-direction:column;gap:6px}
.k1 .bl{background:var(--c1-bg);color:var(--c1)} .k2 .bl{background:var(--c2-bg);color:var(--c2)}
.k3 .bl{background:var(--c3-bg);color:var(--c3)} .k4 .bl{background:var(--c4-bg);color:var(--c4)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.count{font-family:var(--f-mono);font-size:13px;color:var(--muted)}

/* quiz */
.qbox{background:var(--sheet);border:2px solid var(--ink);border-radius:12px;padding:16px;margin-top:14px}
.qbox .qn{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.qbox h3{font-size:18px;margin-top:4px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opt{text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)} .opt.ng{border-color:var(--ng);background:var(--ng-bg)}
.opt[disabled]{cursor:default}
.why{margin-top:12px;font-size:14px;border-left:3px solid var(--line);padding-left:10px}
.why b{display:block}
.why.ok b{color:var(--ok)} .why.ng b{color:var(--ng)}

/* result */
.result{margin-top:20px;display:flex;flex-direction:column;gap:14px}
.score{background:var(--ink);color:var(--paper);border-radius:12px;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.score .big{font-family:var(--f-display);font-size:22px}
.score .stars{font-size:24px;color:#5A6774}
.score .stars .on{color:var(--accent)}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h3{font-size:16px;margin-bottom:6px}
.card ul{margin:6px 0 0;padding-left:1.2em}
.card li{margin-top:4px}
.card.useful{border:2px solid var(--accent)}
.card.useful h3::before{content:"＋ ";color:var(--c4)}
.miss li{font-size:14px}
.miss li span{color:var(--muted)}

@media (max-width:640px){
  .hero{grid-template-columns:1fr;padding-block:16px 28px}
  .diagram{max-width:280px;order:-1}
  .tools{grid-template-columns:1fr}
  .missions{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* entrances */
.doors{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:6px}
.door{text-align:left;background:var(--sheet);border:2px solid var(--ink);border-radius:14px;padding:18px 16px;display:flex;flex-direction:column;gap:8px;box-shadow:4px 4px 0 var(--ink);transition:transform .08s,box-shadow .08s;min-width:0}
.door:hover{transform:translate(-1px,-1px);box-shadow:6px 6px 0 var(--ink)}
.door .dk{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:8px;font-family:var(--f-display);font-size:16px}
.door.d1 .dk{background:var(--c1-bg);color:var(--c1)} .door.d2 .dk{background:var(--c3-bg);color:var(--c3)} .door.d3 .dk{background:var(--c2-bg);color:var(--c2)}
.door strong{font-size:18px;line-height:1.45}
.door span.s{font-size:14px;color:var(--muted)}
.door .go{margin-top:auto;font-family:var(--f-mono);font-size:12px;font-weight:700}
.mlist{display:flex;flex-direction:column;margin-top:14px;border-top:1px solid var(--line)}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.mrow:hover strong{text-decoration:underline}
.mrow > div{min-width:0}
.mrow small{display:block;color:var(--muted);font-size:13px}

/* flow */
.parts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.part{font-size:13px;font-weight:700;border-radius:6px;padding:3px 10px;background:var(--paper);border:1px solid var(--line)}
.prog{display:flex;gap:6px;margin-top:16px}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.prog i.on{background:var(--ink)}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.ans.multi{grid-template-columns:1fr}
.ans .opt{font-weight:500;min-height:56px}
.ans.yn .opt{text-align:center;font-weight:700;font-size:17px}
.ab-tag{font-family:var(--f-mono);font-weight:700;margin-right:6px;color:var(--muted)}
.qback{background:none;border:0;padding:4px 0;color:var(--muted);font-size:14px;margin-top:12px}

.rhead{background:var(--sheet);border:2px solid var(--ink);border-radius:14px;padding:18px 16px;box-shadow:4px 4px 0 var(--ink)}
.rhead h3{font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.4;margin-top:4px}
.rhead p{margin-top:8px}
.meter{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.meter .mr{display:grid;grid-template-columns:7.5em 1fr 2.5em;gap:8px;align-items:center;font-size:14px}
.meter .bar{height:10px;border-radius:5px;background:var(--paper);border:1px solid var(--line);overflow:hidden}
.meter .bar b{display:block;height:100%;background:var(--c3)}
.meter .mr.hi .bar b{background:var(--accent)}
.meter .v{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.acts{counter-reset:a;list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:10px}
.acts li{counter-increment:a;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.acts li::before{content:counter(a);display:grid;place-items:center;width:26px;height:26px;border-radius:6px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-mono);font-weight:700;font-size:13px}
.acts li b{display:block}
.acts li span{font-size:14px;color:var(--muted)}
.care{border:2px solid var(--c2);background:var(--c2-bg)}
.care .tel{font-family:var(--f-mono);font-weight:700;font-size:18px;user-select:all}
.fine{font-size:12px;color:var(--muted)}
.mbtns{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.mbtn{text-align:left;background:var(--paper);border:1.5px solid var(--ink);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.mbtn small{color:var(--muted);display:block;font-size:13px}
.mbtn .arrow{font-family:var(--f-mono);font-weight:700}
@media (max-width:640px){.doors{grid-template-columns:1fr}.ans{grid-template-columns:1fr}.ans.yn{grid-template-columns:1fr 1fr}}

/* 日本語の改行・つぶれ対策 */
body{word-break:keep-all;line-break:strict;overflow-wrap:anywhere}
p,li,.desc,.door span.s,.mrow small,.mbtn small,.scene,.why,.bh{text-wrap:pretty}
.nw{white-space:nowrap}
.ans.ab .opt{display:grid;grid-template-columns:1.5em 1fr;align-items:start;gap:2px}
.ans.ab .ab-tag{margin:0}
.meter{gap:12px}
.meter .mr{grid-template-columns:7.5em 1fr 1.5em;gap:10px}
.meter .mr > span:first-child{white-space:nowrap;font-size:14px}
.meter .bar{display:block;height:12px}
.acts{gap:14px}
.acts li b{line-height:1.6}
.acts li span{display:block;line-height:1.75;margin-top:2px}
.mbtn{padding:12px 14px}
.mbtn small{margin-top:2px;line-height:1.6}
.mrow small{line-height:1.6;margin-top:2px}
.mrow .stars{flex-shrink:0}
.card p{line-height:1.85}
.rhead h3{line-height:1.45}
.label.eyebrow{font-size:15px;letter-spacing:.06em}
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <button class="logo" id="home-link" aria-label="トップへ"><i>分</i>しくみ分解ラボ</button>
</div></header>
<main class="wrap" id="app"></main>
<script>
const MISSIONS = [
  { id:"konbini", lv:1, type:"sort", title:"コンビニのしくみ", desc:"毎日行くお店を3つの役割に分解する", time:"約3分",
    scene:"コンビニは24時間、棚にいつも商品が並んでいます。その裏でやっていることを<b>3つの役割</b>に分けてみよう。",
    cats:[
      {name:"仕入れる", hint:"売るモノを集めてくる"},
      {name:"売る", hint:"お客さんの手に渡す"},
      {name:"整える", hint:"お店を続けられる状態にする"}],
    items:[
      {t:"トラックが1日に何回もおにぎりを運んでくる", c:0, why:"売るモノを店に集めているので「仕入れる」。"},
      {t:"売れた数を見て、明日の注文の数を決める", c:0, why:"次に何をどれだけ集めるかを決めているので「仕入れる」。"},
      {t:"レジで会計をして袋に入れる", c:1, why:"商品をお客さんに渡す瞬間なので「売る」。"},
      {t:"新商品を入口近くの目立つ場所に置く", c:1, why:"手に取ってもらうための工夫なので「売る」。"},
      {t:"床やトイレをそうじする", c:2, why:"直接は売っていないけれど、お客さんがまた来たくなる店にするための仕事なので「整える」。"},
      {t:"シフト表を作って、時間ごとの店員の数を決める", c:2, why:"お店を回せる状態を保つ仕事なので「整える」。"}],
    point:"どんなお店も「集める → 渡す → 続ける」の3つで説明できます。細かい仕事がたくさんあっても、役割の箱に入れると、お店全体のしくみがすっきり見えます。",
    useful:["バイトや文化祭の出店で、自分の仕事が全体のどこにあたるかがわかる","グループで役割分担を決めるとき、だれも担当していない仕事に気づける","ほかのお店（カフェ、本屋）を見たときも同じ箱で分けられる"] },

  { id:"game", lv:1, type:"sort", title:"無料ゲームのしくみ", desc:"タダで遊べるのに、なぜ会社が続くのか", time:"約3分",
    scene:"基本無料のスマホゲームは、ダウンロードにお金がかかりません。それでも運営が続くしくみを<b>3つの役割</b>に分けてみよう。",
    cats:[
      {name:"人を集める", hint:"はじめて遊ぶ人を増やす"},
      {name:"続けてもらう", hint:"遊んだ人に毎日来てもらう"},

/* ===== 質問フロー ===== */
function startFlow(id){
  const f = FLOWS[id]; const picks = [];
  function state(){
    const st={s:{},flags:{},v:{}};
    picks.forEach((p,qi)=>{ const o=f.qs[qi].opts[p];
      if(o.s) for(const k in o.s) st.s[k]=(st.s[k]||0)+o.s[k];
      if(o.f) st.flags[o.f]=true;
      if(o.v) Object.assign(st.v,o.v); });
    return st;
  }
  function draw(){
    const qi=picks.length;
    if(qi>=f.qs.length){ showResult(id, f, state()); return; }
    const q=f.qs[qi];
    app.innerHTML = `<div class="play">
      <button class="back" id="back">← 入口を選びなおす</button>
      <div class="play-head"><div class="label">${f.door}</div><h2>${f.title}</h2></div>
      ${qi===0?`<div class="scene">${f.intro}<div class="parts">${f.parts.map(p=>`<span class="part">${p}</span>`).join("")}</div></div>`:""}
      <div class="prog" aria-label="${qi+1}問目 / ${f.qs.length}問">${f.qs.map((_,i)=>`<i class="${i<=qi?'on':''}"></i>`).join("")}</div>
      <div class="qbox">
        <div class="qn">Q${qi+1} / ${f.qs.length}${q.kind==="ab"?"　AとB、近いほうは？":""}</div>
        <h3>${q.q}</h3>
        <div class="ans ${q.kind}">
          ${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${q.kind==="ab"?`<span class="ab-tag">${"AB"[i]}</span>`:""}${o.t}</button>`).join("")}
        </div>
      </div>
      ${qi>0?`<button class="qback" id="prev">← ひとつ前の質問にもどる</button>`:""}
    </div>`;
    document.getElementById("back").addEventListener("click",()=>renderHome("doors"));
    app.querySelectorAll(".ans .opt").forEach(b=>b.addEventListener("click",()=>{ picks.push(+b.dataset.i); draw(); }));
    const prev=document.getElementById("prev"); if(prev) prev.addEventListener("click",()=>{ picks.pop(); draw(); });
    window.scrollTo(0,0);
  }
  draw();
}

function showResult(id, f, st){
  const key=f.resolve(st); const r=f.results[key];
  let meter="";
  if(f.meter && !r.care){
    const max=f.max || Math.max(1,...f.meter.map(([k])=>st.s[k]||0));
    const top=Math.max(...f.meter.map(([k])=>st.s[k]||0));
    meter=`<div class="card"><h3>${f.meterLabel}</h3><div class="meter">
      ${f.meter.map(([k,l])=>{const v=st.s[k]||0;return `<div class="mr ${v===top&&v>0?'hi':''}"><span>${l}</span><span class="bar"><b style="width:${Math.round(v/max*100)}%"></b></span><span class="v">${v}</span></div>`;}).join("")}
    </div></div>`;
  }
  const missions=(r.missions||[]).map(mid=>MISSIONS.find(m=>m.id===mid));
  const missionCard = missions.length?`<div class="card"><h3>考え方の練習ミッション</h3><p class="fine">この結果と同じ「分け方」を、ゲームで練習できます。</p><div class="mbtns">
      ${missions.map(m=>`<button class="mbtn" data-go="${m.id}"><span><strong>${m.title}</strong><small>${m.desc}<span class="nw">・${m.time}</span></small></span><span class="arrow">→</span></button>`).join("")}</div></div>`:"";
  const actsCard = `<div class="card useful"><h3>おすすめの小さな行動</h3><ol class="acts">${r.acts.map(([a,b])=>`<li><div><b>${a}</b><span>${b}</span></div></li>`).join("")}</ol></div>`;
  const seeFirst = st.v.style==="see";
  app.innerHTML = `<div class="play">
    <button class="back" id="back">← 入口を選びなおす</button>
    <div class="result">
      <div class="rhead ${r.care?'care':''}"><div class="label">あなたの答えから</div><h3>${r.name}</h3><p>${r.desc}</p>
</div>
      ${meter}
      ${seeFirst? actsCard + missionCard : (id==="shikumi"? missionCard + actsCard : actsCard + missionCard)}
      <div class="card"><h3>なぜこれがおすすめ？</h3><p>${r.why}</p></div>
      ${r.link?`<button class="btn primary" id="link">好きなことを探してみる →</button>`:""}
      <div class="actions">
        <button class="btn" id="again">もう一度答える</button>
        <button class="btn" id="home">ほかの入口を見る</button>
      </div>
      ${id==="tired"?`<p class="fine">この結果は答えをもとにしたアイデアで、あなたのことを決めつけるものではありません。つらい状態が続くときは、話せそうな身近な人に相談してみてください。</p>`:""}
    </div></div>`;
  document.getElementById("back").addEventListener("click",()=>renderHome("doors"));
  document.getElementById("again").addEventListener("click",()=>startFlow(id));
  document.getElementById("home").addEventListener("click",()=>renderHome("doors"));
  if(r.link) document.getElementById("link").addEventListener("click",()=>startFlow(r.link));
  app.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>startMission(b.dataset.go)));
  window.scrollTo(0,0);
}

/* ===== 練習ミッション ===== */
function head(m){
  return `<button class="back" id="back">← トップへ</button>
  <div class="play-head">
    <div class="label">練習ミッション ／ ${m.type==="sort"?"仕分け":"えらぶ"}・${m.time}</div>
    <h2>${m.title}</h2>
  </div>
  <div class="scene">${m.scene}</div>`;
}
function bindBack(){ document.getElementById("back").addEventListener("click",()=>renderHome("map")); }
function startMission(id){
  const m = MISSIONS.find(x=>x.id===id);
  if(m.type==="sort") playSort(m); else playQuiz(m);
  window.scrollTo(0,0);
}

function playSort(m){
  const order = m.items.map((_,i)=>i).sort(()=>Math.random()-.5);
  const place = {}; let sel = null; let checked = false;
  app.innerHTML = `<div class="play">${head(m)}
    <p class="howto">部品をタップして選び、入れたい箱をタップ。箱の中の部品をタップするとトレイに戻せます。</p>
    <div class="label" style="margin-top:12px">部品トレイ</div>
    <div class="tray" id="tray"></div>
    <div class="bins" id="bins"></div>
    <div class="actions"><button class="btn primary" id="check" disabled>答え合わせ</button><span class="count" id="count"></span></div>
    <div id="res"></div></div>`;
  bindBack();
  const tray=document.getElementById("tray"), bins=document.getElementById("bins");
  function chip(i){
    const it=m.items[i]; let cls="chip"; let mk="";
    if(checked){ const ok=place[i]===it.c; cls+=ok?" ok":" ng"; mk=`<span class="mk">${ok?"○":"×"}</span>`; }
    else if(sel===i) cls+=" sel";
    return `<button class="${cls}" data-i="${i}" ${checked?"disabled":""}>${mk}${it.t}</button>`;
  }
  function draw(){
    tray.innerHTML = order.filter(i=>place[i]===undefined).map(chip).join("");
    bins.innerHTML = m.cats.map((c,ci)=>`
      <div class="bin k${ci+1} ${sel!==null&&!checked?"ready":""}" data-c="${ci}" role="button" tabindex="0" aria-label="${c.name}の箱">
        <span class="bl">${c.name}</span><span class="bh">${c.hint}</span>
        <div class="in">${order.filter(i=>place[i]===ci).map(chip).join("")}</div>
      </div>`).join("");
    const n=Object.keys(place).length;
    document.getElementById("count").textContent=`${n} / ${m.items.length} 個`;
    document.getElementById("check").disabled = checked || n<m.items.length;
  }
  const root=app.querySelector(".play");
  root.addEventListener("click", e=>{
    if(checked) return;
    const c=e.target.closest(".chip");
    if(c){ const i=+c.dataset.i;
      if(place[i]!==undefined){ delete place[i]; sel=i; } else sel = sel===i?null:i;
      draw(); return; }
    const b=e.target.closest(".bin");
    if(b && sel!==null){ place[sel]=+b.dataset.c; sel=null; draw(); }
  });
  bins.addEventListener("keydown",e=>{ const b=e.target.closest(".bin"); if(b&&(e.key==="Enter"||e.key===" ")&&sel!==null){ e.preventDefault(); place[sel]=+b.dataset.c; sel=null; draw(); }});
  document.getElementById("check").addEventListener("click",()=>{
    checked=true; sel=null; draw();
    const wrong=m.items.map((it,i)=>({it,i})).filter(x=>place[x.i]!==x.it.c);
    const stars = wrong.length===0?3:wrong.length<=2?2:1;
    finish(m, stars, `${m.items.length}個中 ${m.items.length-wrong.length}個 正解`,
      wrong.length? `<div class="card miss"><h3>ちがう箱に入っていた部品</h3><ul>${wrong.map(x=>`<li>${x.it.t}<br><span>→ 正しくは「${m.cats[x.it.c].name}」。${x.it.why}</span></li>`).join("")}</ul></div>`:"");
  });
  draw();
}

function playQuiz(m){
  let qi=0, correct=0;
  app.innerHTML = `<div class="play">${head(m)}<div id="q"></div><div id="res"></div></div>`;
  bindBack();
  const box=document.getElementById("q");
  function drawQ(){
    const q=m.qs[qi];
    box.innerHTML = `<div class="qbox"><div class="qn">Q${qi+1} / ${m.qs.length}</div><h3>${q.q}</h3>
      <div class="opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join("")}</div><div id="w"></div></div>`;
    box.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
      const i=+b.dataset.i, ok=i===q.a; if(ok) correct++;
      box.querySelectorAll(".opt").forEach((x,xi)=>{ x.disabled=true; if(xi===q.a) x.classList.add("ok"); else if(xi===i) x.classList.add("ng"); });
      const last = qi===m.qs.length-1;
      document.getElementById("w").innerHTML = `<div class="why ${ok?"ok":"ng"}"><b>${ok?"正解":"おしい"}</b>${q.why}</div>
        <div class="actions"><button class="btn primary" id="nx">${last?"結果を見る":"次の問題"}</button></div>`;
      document.getElementById("nx").addEventListener("click",()=>{
        if(last){ box.innerHTML=""; const miss=m.qs.length-correct; finish(m, miss===0?3:miss<=2?2:1, `${m.qs.length}問中 ${correct}問 正解`, ""); }
        else { qi++; drawQ(); }
      });
    }));
  }
  drawQ();
}

function finish(m, stars, line, extra){
  const prev=progress[m.id]||0; if(stars>prev){ progress[m.id]=stars; save(); }
  document.getElementById("res").innerHTML = `<div class="result">
    <div class="score"><div><div class="label" style="color:inherit;opacity:.7">MISSION CLEAR</div><div class="big">${line}</div></div><div class="stars">${starHTML(stars)}</div></div>
    ${extra}
    <div class="card"><h3>分解のポイント</h3><p>${m.point}</p></div>
    <div class="card useful"><h3>これが役立つ場面</h3><ul>${m.useful.map(u=>`<li>${u}</li>`).join("")}</ul></div>
    <div class="actions">
      <button class="btn" id="retry">もう一度</button>
      <button class="btn primary" id="doors2">入口の質問に答える</button>
      <button class="btn" id="map2">ミッション一覧</button>
    </div></div>`;
  document.getElementById("retry").addEventListener("click",()=>startMission(m.id));
  document.getElementById("doors2").addEventListener("click",()=>renderHome("doors"));
  document.getElementById("map2").addEventListener("click",()=>renderHome("map"));
  document.getElementById("res").scrollIntoView({behavior:"smooth",block:"start"});
}

/* 日本語の文節で折り返す：ひらがな→それ以外の境目と句読点のあとに改行位置を入れる */
function seg(node){
  const w=document.createTreeWalker(node,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement&&n.parentElement.closest("script,style,svg")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const list=[]; while(w.nextNode()) list.push(w.currentNode);
  for(const t of list){
    const v=t.data.replace(/\u200B/g,"")
      .replace(/([ぁ-ゖ])(?=[^ぁ-ゖー\s、。！？」』）・…\u200B])/g,"$1\u200B")
      .replace(/([、。！？」』）・])(?=[^、。！？」』）\s])/g,"$1\u200B");
    if(v!==t.data) t.data=v;
  }
}
new MutationObserver(ms=>{ for(const m of ms) m.addedNodes.forEach(n=>{ if(n.nodeType===1) seg(n); else if(n.nodeType===3&&n.parentElement) seg(n.parentElement); }); })
  .observe(document.getElementById("app"),{childList:true,subtree:true});
seg(document.querySelector(".top"));

renderHome();
</script>
